name: Update README Stats

on:
  schedule:
    - cron: '0 0 * * *'  # Chạy mỗi ngày lúc 0h
  workflow_dispatch:       # Cho phép chạy thủ công

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch GitHub Stats
        id: stats
        run: |
          DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/users/DuyLinh0212)
          REPOS=$(echo $DATA | python3 -c "import sys,json; print(json.load(sys.stdin)['public_repos'])")
          FOLLOWERS=$(echo $DATA | python3 -c "import sys,json; print(json.load(sys.stdin)['followers'])")
          echo "repos=$REPOS" >> $GITHUB_OUTPUT
          echo "followers=$FOLLOWERS" >> $GITHUB_OUTPUT

      - name: Update README badges
        run: |
          sed -i "s/Public_Repos-[0-9]*/Public_Repos-${{ steps.stats.outputs.repos }}/" README.md
          sed -i "s/Followers-[0-9]*/Followers-${{ steps.stats.outputs.followers }}/" README.md

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "🤖 Auto-update README stats"
          git push
